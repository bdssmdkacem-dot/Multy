name: Validate Multy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate site pages
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class CheckHTML(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.tags = []
                  self.ids = set()
                  self.title_depth = 0
                  self.title_text = []

              def handle_starttag(self, tag, attrs):
                  self.tags.append(tag)
                  attrs = dict(attrs)
                  if "id" in attrs:
                      assert attrs["id"] not in self.ids, f"Duplicate id: {attrs['id']}"
                      self.ids.add(attrs["id"])
                  if tag == "title":
                      self.title_depth += 1

              def handle_endtag(self, tag):
                  if tag == "title" and self.title_depth:
                      self.title_depth -= 1

              def handle_data(self, data):
                  if self.title_depth:
                      self.title_text.append(data)

          for filename in ("index.html", "app.html"):
              path = Path(filename)
              assert path.is_file(), f"{filename} is missing"
              source = path.read_text(encoding="utf-8")
              parser = CheckHTML()
              parser.feed(source)
              parser.close()
              assert "html" in parser.tags and "main" in parser.tags, f"{filename}: expected html and main"
              assert "style" in parser.tags, f"{filename}: inline CSS is missing"
              assert "".join(parser.title_text).strip(), f"{filename}: page title is missing"
              assert 'lang="fr"' in source, f"{filename}: French language metadata is missing"
              if filename == "app.html":
                  assert "script" in parser.tags, "Dashboard JavaScript is missing"
                  assert "transactionRows" in parser.ids and "search" in parser.ids, "Dashboard controls are missing"
              print(f"{filename}: structural checks passed ({len(parser.tags)} elements).")
          PY
