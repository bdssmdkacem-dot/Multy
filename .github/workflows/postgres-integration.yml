name: Multy PostgreSQL integration
on:
  push:
    branches: [main, 'commercial/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  postgres-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: multy_test
          POSTGRES_USER: multy
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multy -d multy_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://multy:test-only-password@localhost:5432/multy_test
      MULTY_JWT_SECRET: postgres-ci-secret-never-use-in-production
      PGPASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install API dependencies
        run: pip install -r requirements.txt
      - name: Apply PostgreSQL schema
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg
          statements = [part.strip() for part in Path("backend/schema.sql").read_text().split(";") if part.strip()]
          with psycopg.connect(
              host="localhost",
              port=5432,
              dbname="multy_test",
              user="multy",
              password=os.environ["PGPASSWORD"],
          ) as conn:
              for statement in statements:
                  conn.execute(statement)
          PY
      - name: Test API against real PostgreSQL
        run: python -m pytest -q tests/test_postgres_api.py
      - name: Build API container image
        run: docker build -f Dockerfile.api -t multy-api:ci .
      - name: Start API container against PostgreSQL
        run: |
          docker run -d --name multy-api-ci --network host \
            -e DATABASE_URL=postgresql+psycopg://multy:test-only-password@127.0.0.1:5432/multy_test \
            -e MULTY_JWT_SECRET="$MULTY_JWT_SECRET" multy-api:ci
      - name: Smoke-test live HTTP endpoints
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/health
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/companies)
          test "$status" = "401"
      - name: Print API container logs on failure
        if: failure()
        run: docker logs multy-api-ci || true
