name: Multy PostgreSQL integration
on:
  push:
    branches: [main, 'commercial/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  postgres-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: multy_test
          POSTGRES_USER: multy
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U multy -d multy_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://multy:test-only-password@localhost:5432/multy_test
      MULTY_JWT_SECRET: postgres-ci-secret-never-use-in-production
      PGPASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install API dependencies
        run: pip install -r requirements.txt
      - name: Apply PostgreSQL schema
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg
          statements = [part.strip() for part in Path("backend/schema.sql").read_text().split(";") if part.strip()]
          with psycopg.connect(os.environ["DATABASE_URL"]) as conn:
              for statement in statements:
                  conn.execute(statement)
          PY
      - name: Test API against real PostgreSQL
        run: python -m pytest -q tests/test_postgres_api.py
      - name: Build API container image
        run: docker build -f Dockerfile.api -t multy-api:ci .
