name: Multy API tests
on:
  push:
    branches: [main, 'commercial/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install API dependencies
        run: pip install -r requirements.txt
      - name: Run API tenant-isolation tests
        run: python -m pytest -q tests/test_api.py
